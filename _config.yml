# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Introduction to Computational Techniques for Maths and Physics
author: University of Portsmouth
logo: logo.png
only_build_toc_files: True

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  allow_errors: True
  exclude_patterns: [lecture_3/Part_4_while_loops.ipynb,
                     lecture_2/4_Writing_Functions_Exercises.ipynb,
                     lecture_2/5_Writing_functions_exercises_2.ipynb,
                     lecture_2/12_Summary_Exercises.ipynb]

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/icg-gravwaves/M24568_M20741_CompSMAP  # Online location of your book
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

launch_buttons:
  notebook_interface: "jupyterlab"
  colab_url: "https://colab.research.google.com"
  thebe: true

# Note: _static/force_download.js forces the ".ipynb" download button to
# actually download rather than navigate to the raw file (GitHub Pages sends
# no Content-Disposition header). Jupyter Book auto-includes any .js file
# found under _static/, so no extra config is needed here to load it.

# .claude/ holds local, gitignored working notes and must never be built into
# the site (it would otherwise get deployed to the live gh-pages site).
sphinx:
  config:
    exclude_patterns: [".claude", ".claude/**"]
